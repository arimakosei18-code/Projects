name: HTTP smoke tests

on:
  push:
    paths:
      - '**/*.cs'
      - 'Tools/HttpSmokeTester/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**/*.cs'
      - 'Tools/HttpSmokeTester/**'

jobs:
  http-smoke:
    name: HTTP smoke tester
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: microsoft/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Publish server for smoke tests
        run: dotnet publish NetworkMonitor.Server/NetworkMonitor.Server.csproj -c Release -o Tools/HttpSmokeTester/published --no-restore

      - name: Install native dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdiplus libc6-dev
          # some distributions use a different soname; create a symlink if needed
          sudo ln -s /usr/lib/libgdiplus.so /usr/lib/libgdiplus.so.0 || true

      - name: Run HTTP smoke tester
        run: dotnet run --project Tools/HttpSmokeTester/HttpSmokeTester.csproj -c Release --no-build
        timeout-minutes: 5
        env:
          SERVER_DLL_PATH: Tools/HttpSmokeTester/published/NetworkMonitor.Server.dll

      - name: Collect diagnostics on failure (Linux)
        if: failure() && runner.os == 'Linux'
        run: |
          echo "=== dotnet --info ==="
          dotnet --info || true
          echo "=== ls Tools/HttpSmokeTester/published ==="
          ls -la Tools/HttpSmokeTester/published || true
          echo "=== published deps files ==="
          ls Tools/HttpSmokeTester/published/*.deps.json 2>/dev/null || true
          echo "=== tail runner syslog (if exists) ==="
          sudo journalctl -n 200 --no-pager || true
